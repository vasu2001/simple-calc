<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="fused-app" />
<meta name="fused-api-version" content="1" />
<title>Calculator</title>
<style>
  :root, :root[data-theme="dark"]
              { color-scheme: dark;  --bg: #101318; --text: #dce2ea; --muted: #9aa0a6; --line: #2a303a;
                --key: #1a1f27; --key-hover: #232a35; --op: #2a3546; --accent: #e3342f; --accent-text: #ffffff; }
  :root[data-theme="light"]
              { color-scheme: light; --bg: #f7f8fa; --text: #1a1f27; --muted: #5f6672; --line: #d8dce3;
                --key: #ffffff; --key-hover: #eef1f5; --op: #e3e9f2; --accent: #d62828; --accent-text: #ffffff; }
  :root[data-theme="mint"]
              { color-scheme: light; --bg: #eefaf4; --text: #123326; --muted: #4f7d6c; --line: #bfe3d2;
                --key: #ffffff; --key-hover: #dff3e9; --op: #cdeee0; --accent: #d62828; --accent-text: #ffffff; }
  :root[data-theme="sunset"]
              { color-scheme: dark;  --bg: #201319; --text: #f6e4de; --muted: #c99b8c; --line: #4a2b32;
                --key: #2c1920; --key-hover: #3a2129; --op: #4a2b32; --accent: #e3342f; --accent-text: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .calc {
    width: 300px;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    background: var(--key);
    transition: width 0.15s ease;
  }
  .calc.wide { width: 360px; }
  .display {
    text-align: right;
    padding: 12px 8px 16px;
    overflow: hidden;
  }
  .expr {
    min-height: 18px;
    font-size: 14px;
    color: var(--muted);
    word-break: break-all;
  }
  .value {
    font-size: 34px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .value.long { font-size: 22px; }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .sci-keys {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .sci-keys button { font-size: 14px; padding: 10px 0; }
  button {
    font: inherit;
    font-size: 18px;
    padding: 14px 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--key);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.95); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.op { background: var(--op); }
  button.eq { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.eq:hover { filter: brightness(1.1); }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .theme-row {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }
  .mode-row {
    display: flex;
    justify-content: flex-start;
    gap: 4px;
  }
  .mode-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 20px;
    padding: 0;
    font-size: 10px;
    border-radius: 6px;
  }
  .mode-btn[data-active="true"] {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .theme-dot {
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .theme-dot[data-active="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-dot[data-t="dark"]   { background: #101318; }
  .theme-dot[data-t="light"]  { background: #f7f8fa; }
  .theme-dot[data-t="mint"]   { background: #eefaf4; border-color: #bfe3d2; }
  .theme-dot[data-t="sunset"] { background: #201319; }
</style>
</head>
<body>
  <div class="calc">
    <div class="top-row">
      <div class="mode-row" id="modeRow" role="radiogroup" aria-label="Calculator mode">
        <button class="mode-btn" data-m="basic" title="Basic" aria-label="Basic mode">123</button>
        <button class="mode-btn" data-m="sci" title="Scientific" aria-label="Scientific mode">fx</button>
      </div>
      <div class="theme-row" id="themeRow" role="radiogroup" aria-label="Theme">
        <button class="theme-dot" data-t="dark" title="Dark" aria-label="Dark theme"></button>
        <button class="theme-dot" data-t="light" title="Light" aria-label="Light theme"></button>
        <button class="theme-dot" data-t="mint" title="Mint" aria-label="Mint theme"></button>
        <button class="theme-dot" data-t="sunset" title="Sunset" aria-label="Sunset theme"></button>
      </div>
    </div>
    <div class="display">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="value" id="value" aria-live="polite">0</div>
    </div>
    <div class="sci-keys" id="sciKeys" style="display:none">
      <button data-k="(" class="op" aria-label="Open parenthesis">(</button>
      <button data-k=")" class="op" aria-label="Close parenthesis">)</button>
      <button data-k="^" class="op" aria-label="Power">^</button>
      <button data-k="sqrt(" class="op" aria-label="Square root">√</button>
      <button data-k="^2" class="op" aria-label="Square">x²</button>
      <button data-k="π" class="op" aria-label="Pi">π</button>
      <button data-k="sin(" class="op" aria-label="Sine">sin</button>
      <button data-k="cos(" class="op" aria-label="Cosine">cos</button>
      <button data-k="tan(" class="op" aria-label="Tangent">tan</button>
      <button data-k="log(" class="op" aria-label="Log base 10">log</button>
      <button data-k="ln(" class="op" aria-label="Natural log">ln</button>
      <button data-k="inv" class="op" aria-label="Reciprocal">1/x</button>
    </div>
    <div class="keys" id="keys">
      <button data-k="C" class="op" aria-label="Clear">C</button>
      <button data-k="⌫" class="op" aria-label="Backspace">⌫</button>
      <button data-k="%" class="op" aria-label="Percent">%</button>
      <button data-k="/" class="op" aria-label="Divide">÷</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="*" class="op" aria-label="Multiply">×</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="-" class="op" aria-label="Subtract">−</button>
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="+" class="op" aria-label="Add">+</button>
      <button data-k="0" style="grid-column: span 2">0</button>
      <button data-k=".">.</button>
      <button data-k="=" class="eq" aria-label="Equals">=</button>
    </div>
  </div>
  <script>
    const exprEl = document.getElementById("expr");
    const valueEl = document.getElementById("value");

    // Recursive-descent evaluator: numbers, + - * / % ^, parens, sin/cos/tan/log/ln/sqrt, π, no eval().
    function evaluate(s) {
      let i = 0;
      function num() {
        const m = /^\d*\.?\d+/.exec(s.slice(i));
        if (!m) throw new Error("bad");
        i += m[0].length;
        return parseFloat(m[0]);
      }
      function primary() {
        const fm = /^(sin|cos|tan|log|ln|sqrt)\(/.exec(s.slice(i));
        if (fm) {
          i += fm[0].length;
          const arg = expr();
          if (s[i] !== ")") throw new Error("bad");
          i++;
          switch (fm[1]) {
            case "sin": return Math.sin((arg * Math.PI) / 180);
            case "cos": return Math.cos((arg * Math.PI) / 180);
            case "tan": return Math.tan((arg * Math.PI) / 180);
            case "log": return Math.log10(arg);
            case "ln": return Math.log(arg);
            case "sqrt": return Math.sqrt(arg);
          }
        }
        if (s[i] === "(") {
          i++;
          const v = expr();
          if (s[i] !== ")") throw new Error("bad");
          i++;
          return v;
        }
        if (s[i] === "π") { i++; return Math.PI; }
        if (s[i] === "e" && !/[a-z]/i.test(s[i + 1] || "")) { i++; return Math.E; }
        return num();
      }
      function unary() {
        if (s[i] === "-") { i++; return -unary(); }
        return primary();
      }
      function power() {
        const v = unary();
        if (s[i] === "^") { i++; return Math.pow(v, power()); }
        return v;
      }
      function term() {
        let v = power();
        while (s[i] === "*" || s[i] === "/") {
          const op = s[i++];
          const r = power();
          v = op === "*" ? v * r : v / r;
        }
        return v;
      }
      function expr() {
        let v = term();
        while (s[i] === "+" || s[i] === "-") {
          const op = s[i++];
          const r = term();
          v = op === "+" ? v + r : v - r;
        }
        return v;
      }
      const v = expr();
      if (i !== s.length) throw new Error("bad");
      return v;
    }

    function fmt(n) {
      if (!isFinite(n)) return "Error";
      return String(parseFloat(n.toPrecision(12)));
    }

    function getExpr() { return fused.params.get("expr") || ""; }
    function setExpr(e) { fused.params.set("expr", e); }

    const THEMES = ["dark", "light", "mint", "sunset"];
    function getTheme() {
      const t = fused.params.get("theme");
      return THEMES.includes(t) ? t : "dark";
    }
    function setTheme(t) { fused.params.set("theme", t); }

    const MODES = ["basic", "sci"];
    function getMode() {
      const m = fused.params.get("mode");
      return MODES.includes(m) ? m : "basic";
    }
    function setMode(m) { fused.params.set("mode", m); }

    function drawTheme() {
      const t = getTheme();
      document.documentElement.setAttribute("data-theme", t);
      document.querySelectorAll(".theme-dot").forEach((b) => {
        b.dataset.active = String(b.dataset.t === t);
      });
    }

    function drawMode() {
      const m = getMode();
      const sci = m === "sci";
      document.getElementById("sciKeys").style.display = sci ? "grid" : "none";
      document.querySelector(".calc").classList.toggle("wide", sci);
      document.querySelectorAll(".mode-btn").forEach((b) => {
        b.dataset.active = String(b.dataset.m === m);
      });
    }

    function draw() {
      drawTheme();
      drawMode();
      const e = getExpr();
      exprEl.innerHTML = e ? e.replace(/\//g, "÷").replace(/\*/g, "×") : "&nbsp;";
      let out = "0";
      if (e) {
        try { out = fmt(evaluate(e)); }
        catch { out = /[+\-*/]$/.test(e) ? "…" : "Error"; }
      }
      valueEl.textContent = out;
      valueEl.classList.toggle("long", out.length > 9);
    }

    function press(k) {
      // test
      let e = getExpr();
      if (k === "C") e = "";
      else if (k === "⌫") e = e.slice(0, -1);
      else if (k === "=") {
        try { e = fmt(evaluate(e)); if (e === "Error") e = ""; } catch { return; }
      } else if (k === "%") {
        const m = /-?\d*\.?\d+$/.exec(e);
        if (!m) return;
        e = e.slice(0, m.index) + fmt(parseFloat(m[0]) / 100);
      } else if (k === "inv") {
        const m = /-?\d*\.?\d+$/.exec(e);
        if (!m) return;
        e = e.slice(0, m.index) + "1/(" + m[0] + ")";
      } else if ("+-*/".includes(k)) {
        if (!e && k !== "-") return;
        if (/[+*/]$/.test(e)) e = e.slice(0, -1) + k;           // replace operator
        else if (/-$/.test(e) && k !== "-") e = e.slice(0, -1) + k;
        else e += k;
      } else if (k === ".") {
        const last = /[\d.]*$/.exec(e)[0];
        if (last.includes(".")) return;
        e += last ? "." : "0.";
      } else {
        e += k;
      }
      setExpr(e);
    }

    document.getElementById("keys").addEventListener("click", (ev) => {
      const b = ev.target.closest("button");
      if (b) press(b.dataset.k);
    });

    document.getElementById("themeRow").addEventListener("click", (ev) => {
      const b = ev.target.closest(".theme-dot");
      if (b) setTheme(b.dataset.t);
    });

    document.getElementById("modeRow").addEventListener("click", (ev) => {
      const b = ev.target.closest(".mode-btn");
      if (b) setMode(b.dataset.m);
    });

    document.getElementById("sciKeys").addEventListener("click", (ev) => {
      const b = ev.target.closest("button");
      if (b) press(b.dataset.k);
    });

    document.addEventListener("keydown", (ev) => {
      const k = ev.key;
      if (/^[\d.+\-*/%]$/.test(k)) press(k);
      else if (k === "Enter" || k === "=") { ev.preventDefault(); press("="); }
      else if (k === "Backspace") press("⌫");
      else if (k === "Escape") press("C");
    });

    fused.params.onChange(draw);
    draw();
  </script>
</body>
</html>
